services:
  db:
    image: mysql:8.0
    container_name: sindinails-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: 'sindinails_db'
      MYSQL_USER: 'user'
      MYSQL_PASSWORD: 'password'
      MYSQL_ROOT_PASSWORD: 'root_password'
    volumes:
      - db_data:/var/lib/mysql
      - ./backend-springboot/init-db:/docker-entrypoint-initdb.d
    networks:
      - sindinails-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "user", "-p$$MYSQL_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend-springboot
    container_name: sindinails-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      - JWT_SECRET_KEY=EWtqmcTfU6SC13R5Z4D1Rw4UPadI/TD4D86kDBGi+zA=
      - JWT_EXPIRATION=86400000
    networks:
      - sindinails-net

  frontend:
    build: ./frontend-react
    container_name: sindinails-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - sindinails-net

volumes:
  db_data:

networks:
  sindinails-net: