services:
  db:
    image: mysql:8.0
    container_name: sindinails-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:?Falta DB_NAME en .env}
      MYSQL_USER: ${DB_USERNAME:?Falta DB_USERNAME en .env}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Falta DB_PASSWORD en .env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Falta DB_ROOT_PASSWORD en .env}
    ports:
      - "${DB_PORT:-3307}:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./backend-springboot/init-db:/docker-entrypoint-initdb.d
    networks:
      - sindinails-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "user", "-p$$MYSQL_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend-springboot
    container_name: sindinails-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://db:3306/${DB_NAME}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:?Falta JWT_SECRET_KEY en .env}
      - JWT_EXPIRATION=${JWT_EXPIRATION:-86400000}
    networks:
      - sindinails-net

  frontend:
    build: ./frontend-react
    container_name: sindinails-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    environment:
      - BACKEND_URL=backend:8080
    depends_on:
      - backend
    networks:
      - sindinails-net

volumes:
  db_data:

networks:
  sindinails-net: