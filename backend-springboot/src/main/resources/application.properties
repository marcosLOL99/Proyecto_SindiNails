# Configuración de Datasource para Railway (y otros entornos PaaS)
# Railway inyecta una variable DATABASE_URL con el formato mysql://...
# La siguiente línea reemplaza 'mysql://' por 'jdbc:mysql://' para que Spring pueda usarla.
spring.datasource.url=${DATABASE_URL:jdbc:mysql://db:3306/sindinails_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true}
spring.datasource.username=${MYSQLUSER} # Railway también inyecta estas por separado
spring.datasource.password=${MYSQLPASSWORD} # por si se necesitan.
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Para el primer despliegue en Railway, 'validate' es más seguro.
# Usamos 'update' para que Hibernate pueda crear/actualizar el esquema de la BD si es necesario.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.show-sql=true

