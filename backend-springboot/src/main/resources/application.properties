# Carga el .env de la raíz del proyecto si existe (opcional).
# Dos rutas: ejecutando desde backend-springboot/ (mvnw) o desde la raíz (IDE).
# Dentro de docker no hay .env: las variables llegan desde docker-compose.yml.
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]

# Datasource: por defecto, el MySQL local de docker compose (puerto expuesto DB_PORT).
# En docker, SPRING_DATASOURCE_URL (docker-compose.yml) sobrescribe esta URL.
spring.datasource.url=jdbc:mysql://localhost:${DB_PORT:3307}/${DB_NAME:sindinails_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.show-sql=true

# JWT
app.security.jwt.secret-key=${JWT_SECRET_KEY}
app.security.jwt.expiration=${JWT_EXPIRATION}
