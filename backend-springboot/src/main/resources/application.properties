# Configuración de Datasource para Railway (y otros entornos PaaS)
# Railway inyectará estas variables de entorno automáticamente.
# El valor por defecto después de los ':' es para que funcione con tu docker-compose local.
spring.datasource.url=jdbc:mysql://turntable.proxy.rlwy.net:58089/railway?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${MYSQLUSER}
spring.datasource.password=${MYSQLPASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Usamos 'update' para que Hibernate pueda crear/actualizar el esquema de la BD si es necesario.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.show-sql=true

# JWT
# Estas variables las configurarás manualmente en el dashboard de Railway.
app.security.jwt.secret-key=${JWT_SECRET_KEY}
app.security.jwt.expiration=${JWT_EXPIRATION}