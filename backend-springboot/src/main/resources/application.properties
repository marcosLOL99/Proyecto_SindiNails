# Configuración de Datasource para Railway (y otros entornos PaaS)
# Railway inyectará estas variables de entorno automáticamente.
spring.datasource.url=jdbc:mysql://${MYSQLHOST}:${MYSQLPORT}/${MYSQLDATABASE}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${MYSQLUSER}
spring.datasource.password=${MYSQLPASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Para el primer despliegue en Railway, 'validate' es más seguro.
# 'validate' comprueba que el esquema de la BD coincida con las entidades, pero no hace cambios.
# Si necesitas que Hibernate cree las tablas la primera vez, puedes ponerlo temporalmente en 'update' y luego cambiarlo a 'validate'.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.show-sql=true

