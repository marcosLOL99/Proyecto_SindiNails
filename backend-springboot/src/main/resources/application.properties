# Configuración de Datasource para Railway (y otros entornos PaaS)
# Railway inyectará estas variables de entorno automáticamente.
# El valor por defecto después de los ':' es para que funcione con tu docker-compose local.
spring.datasource.url=jdbc:mysql://${MYSQLHOST:db}:${MYSQLPORT:3306}/${MYSQLDATABASE:sindinails_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${MYSQLUSER:user}
spring.datasource.password=${MYSQLPASSWORD:password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Usamos 'update' para que Hibernate pueda crear/actualizar el esquema de la BD si es necesario.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.show-sql=true

# JWT
# Estas variables las configurarás manualmente en el dashboard de Railway.
app.security.jwt.secret-key=${JWT_SECRET_KEY:NDFkMzM0OWE0ZjY3NTM3NTZiNzk4NmQxZTZhNzM5N2MyZTY1NTM4NWM3M2E2ZjQ4OTI3OWE5M2YxYjkwY2U3YQ==}
app.security.jwt.expiration=${JWT_EXPIRATION:86400000}

# Orígenes permitidos para CORS. En producción, esto será la URL de tu frontend en Railway.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost}